[project]
name = "miru-voice"
version = "0.1.0"
description = "Miru Voice — local push-to-talk dictation for macOS (Apple Silicon)"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "silero-vad>=5.0",
    "faster-whisper>=1.0",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "Pillow>=10",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
llm = [
    "llama-cpp-python>=0.2.79",
]

[project.scripts]
miru-voice = "miru_voice.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: requires Apple Silicon GPU/CPU and downloaded models"]

[tool.ruff]
line-length = 100
target-version = "py311"
