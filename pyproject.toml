[project]
name = "dictado"
version = "0.1.0"
description = "Local push-to-talk dictation for Windows (RTX 3080)"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "silero-vad>=5.0",
    "faster-whisper>=1.0",
    "pynput>=1.7",
    "pywin32>=306",
    "pystray>=0.19",
    "Pillow>=10",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
llm = [
    # CUDA wheel — install via: pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu121/ llama-cpp-python
    "llama-cpp-python>=0.2.79",
]

[project.scripts]
dictado = "dictado.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
